<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RockSteady has moved</title>
  <link rel="canonical" href="https://rocksteadyfitness.com/">
  <script>
    // Send every old URL to the same path on the new domain,
    // e.g. /pages/privacy.html -> https://rocksteadyfitness.com/pages/privacy.html
    location.replace("https://rocksteadyfitness.com" + location.pathname + location.search + location.hash);
  </script>
  <!-- Fallback when JavaScript is off: go to the new homepage. -->
  <meta http-equiv="refresh" content="0; url=https://rocksteadyfitness.com/">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #1a2238; text-align: center; padding: 20vh 16px; }
    a { color: #1f5fbf; }
    @media (prefers-color-scheme: dark) { body { background: #10141f; color: #e8ecf5; } a { color: #7fb0ff; } }
  </style>
</head>
<body>
  <p>RockSteady has moved to <a href="https://rocksteadyfitness.com/">rocksteadyfitness.com</a>.</p>
</body>
</html>
